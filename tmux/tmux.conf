# =============================================================================
# TMUX Configuration - Clean & Minimal
# =============================================================================

# --- 1. GENERAL TMUX SETTINGS ---
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set-option -g status-position top
set -g allow-passthrough on
set -g visual-activity off

# --- 2. PREFIX KEY (Alt-a) ---
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# --- 3. WINDOW & PANE NAVIGATION ---
bind -n M-H previous-window
bind -n M-L next-window

unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind-key H swap-pane -L
bind-key L swap-pane -R
bind-key J swap-pane -D
bind-key K swap-pane -U

bind -r m resize-pane -Z
bind b set-option status

# Alt + number to switch windows
bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4
bind -n M-6 select-window -t 5
bind -n M-7 select-window -t 6
bind -n M-8 select-window -t 7
bind -n M-9 select-window -t 8


# --- 4. WINDOW NAMING ---
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# --- 5. STATUS LINE SETTINGS ---
set -g status-interval 1

# Source auto-generated colors from Neovim
source-file ~/.config/tmux/tmux_colors.conf

# Use the auto-generated colors instead of hardcoded values
# set -g status-bg "#{@color_status_bg}"
# set -g status-fg "#{@color_status_fg}"

# Window status format - cleaner, more compact
set -g window-status-format "#[bg=#{@color_inactive_bg}]#[fg=#{@color_inactive_fg}] #I:#W #[default]"
set -g window-status-current-format "#[bg=#{@color_index_bg}]#[fg=#{@color_index_fg}] #I:#W #[default]"

set -g window-status-separator ""

# --- 6. TMUX PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @continuum-restore 'on'
set -g @resurrect-save 'on'
set -g @continuum-save-interval '10'

set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"

# --- 7. PLUGIN INITIALIZATION ---
run '~/.config/tmux/plugins/tpm/tpm'

# --- 8. CUSTOM STATUS BAR (AFTER TPM) ---

# Left side: Session name with more padding after
set -g status-left ' #[fg=#{@color_session_name}]#{session_name} #[default]   '

# Right side: Battery with color coding + Time (no separator)
set -g status-right '#(bat_pct=$(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh | tr -d "%"); if [ "$bat_pct" -lt 20 ] 2>/dev/null; then echo "#[fg=#ff5555]󱊣 ${bat_pct}%"; else echo "#[fg=#{@color_battery_icon}]󱊢 ${bat_pct}%"; fi) #[fg=#{@color_time_date}] %H:%M '



