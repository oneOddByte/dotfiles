# #######################################################################################
# HYPRLAND CONFIG - UPDATED FOR v0.53.0
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

################
### MONITORS ###
################

monitor=eDP-1, 1920x1080@60, 0x0, 1

###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$browser = brave
$fileManager = nautilus
$menu = albert toggle

#################
### AUTOSTART ###
#################

exec-once = ~/.config/hypr/scripts/startup.sh
exec-once = blueman-applet &
exec-once = albert &
exec-once = polkit-gnome-authentication-agent-1 &
exec-once = dunst &
exec-once = waybar &
exec-once = wlsunset -l 10.99 -L 76.95 -t 5200 -T 6500
exec-once = tmux
exec-once = gnome-keyring-daemon --start --components=secrets

# --- Wallpaper & Theme ---
# exec-once = ~/.config/hypr/scripts/wall-engine

# Keybind to change wallpaper on the fly
bind = SUPER, W, exec, ~/.config/hypr/scripts/wall-engine.sh

# --- Power Menu ---
bind = SUPER, X, exec, ~/.config/rofi/scripts/power-manager

# --- WiFi Menu ---
bind = SUPER, N, exec, ~/.config/rofi/scripts/wifi-manager

# --- Bluetooth TUI ---
bind = SUPER SHIFT, B, exec, ~/.config/hypr/scripts/toggle-bt.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    no_focus_fallback = true
    gaps_in = 4
    gaps_out = 8
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
        xray = true
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
    animation = specialWorkspace, 1,  6,     easeOutQuint,  slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = 
    kb_rules =
    follow_mouse = 1
    sensitivity = 0.35

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = ALT,  TAB, workspace, previous
bind = ALT, TAB, exec, hyprctl dispatch plugin toggle hyprexpo
bind = SUPER, I, exec, ~/.dotfiles/waybar/scripts/toggle_waybar.sh
bind = $mainMod, minus, fullscreen, 1
bind = $mainMod, space, exec, $menu

# Clipboard manager
bind = $mainMod, V, exec, copyq toggle

# Fullscreen screenshot to editor
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -

bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, return, exec, $browser

bind = $mainMod, Q, killactive,
bind = $mainMod, Z, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, togglefloating,
bind = $mainMod, R, exec, wofi
bind = $mainMod, P, pseudo,
bind = $mainMod, T, togglesplit, 

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, a, workspace, 1
bind = $mainMod, s, workspace, 2
bind = $mainMod, d, workspace, 3
bind = $mainMod, f, workspace, 4
bind = $mainMod, 1, workspace, 5
bind = $mainMod, 2, workspace, 6
bind = $mainMod, 3, workspace, 7
bind = $mainMod, 4, workspace, 8
bind = $mainMod, 5, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move focused window to a workspace silently
$d=[$ws|Navigation|Move window silently]
bindd = $mainMod Alt, 1, $d move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, $d move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, $d move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, $d move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, $d move to workspace 5  (silent), movetoworkspacesilent, 5
bindd = $mainMod Alt, 6, $d move to workspace 6  (silent), movetoworkspacesilent, 6
bindd = $mainMod Alt, 7, $d move to workspace 7  (silent), movetoworkspacesilent, 7
bindd = $mainMod Alt, 8, $d move to workspace 8  (silent), movetoworkspacesilent, 8
bindd = $mainMod Alt, 9, $d move to workspace 9  (silent), movetoworkspacesilent, 9
bindd = $mainMod Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

$d=[$wm|Resize Active Window]
# Resize windows
bindde = $mainMod Shift, Right, $d resize window right , resizeactive, 30 0
bindde = $mainMod Shift, Left, $d resize window left, resizeactive, -30 0
bindde = $mainMod Shift, Up, $d resize window up, resizeactive, 0 -30
bindde = $mainMod Shift, Down, $d resize  window down, resizeactive, 0 30

# Move active window around current workspace with mainMod + Shift + Control [←→↑↓]
$d=[$wm|Move active window across workspace]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = $mainMod Shift Control, h, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Control, l, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Control, k, Move active window up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Control, j, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Example special workspace (scratchpad)
bind = $mainMod, g, togglespecialworkspace, magic
bind = $mainMod SHIFT, g, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, o, exec, wofi --show drun

##############################
### WINDOWS AND WORKSPACES ###
##############################

# NEW v0.53 WINDOW RULE SYNTAX - All rules rewritten

# Opacity for ghostty terminal
windowrule = opacity 0.98 override 0.885 override, match:class ^(com.mitchellh.ghostty)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(Alacritty)$

# Ignore maximize requests from apps
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Float file dialogs
windowrule = float on, match:title ^(Open File|Open|Save|Save as|Export|Import|Choose File|Rename)$, match:class ^(.*)$
windowrule = center on, match:title ^(Open File|Open|Save|Save as|Export|Import|Choose File|Rename)$, match:class ^(.*)$

# Float Google sign-in
windowrule = float on, match:title ^(Sign in – Google accounts - Brave)$
windowrule = center on, match:title ^(Sign in – Google accounts - Brave)$

# Float portal dialogs
windowrule = float on, match:class (xdg-desktop-portal-gtk)
windowrule = center on, match:class (xdg-desktop-portal-gtk)
windowrule = float on, match:class (xdg-desktop-portal-hyprland)
windowrule = center on, match:class (xdg-desktop-portal-hyprland)
windowrule = float on, match:class (Xdg-desktop-portal-gtk)
windowrule = center on, match:class (Xdg-desktop-portal-gtk)
windowrule = border_size 0, match:class (Xdg-desktop-portal-gtk)
windowrule = float on, match:class (Xdg-desktop-portal-hyprland)
windowrule = center on, match:class (Xdg-desktop-portal-hyprland)

# Float common apps
windowrule = float on, match:class (pavucontrol)
windowrule = float on, match:class (blueman-manager)
    windowrule = float on, match:title ^(bluetui)$
    windowrule = size 900 650, match:title ^(bluetui)$
    windowrule = center on, match:title ^(bluetui)$
windowrule = float on, match:class (nm-connection-editor)
windowrule = float on, match:class (com.github.hluk.copyq)

# Picture-in-Picture - NEW v0.53 SYNTAX
windowrule = tag +picture-in-picture, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = float on, match:tag picture-in-picture
windowrule = move ((monitor_w*0.73)) ((monitor_h*0.72)), match:tag picture-in-picture
windowrule = min_size 300 200, match:tag picture-in-picture
windowrule = pin on, match:tag picture-in-picture

##############################
### LAYER RULES - NEW v0.53 ###
##############################

# Waybar blur - NEW v0.53 SYNTAX
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar

# Waybar positioning (if you're using it as a window)
windowrule = float on, match:class (waybar)
windowrule = size (monitor_w*1) 40, match:class (waybar)
windowrule = move (0) (10), match:class (waybar)

##############################
### WORKSPACE RULES ###
##############################

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
