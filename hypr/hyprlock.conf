# ----------------------------------------
# Background
# ----------------------------------------
background {
    monitor = eDP-1
    path = ~/Pictures/foggy-night-wallpaper-1920x1080-supernatural-elements-supernatural-28415.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.75
}

# ----------------------------------------
# Clock (BIG)
# ----------------------------------------
text {
    monitor = eDP-1
    text = $TIME
    color = rgb(205, 214, 244)
    font = "Fira Code"
    font_size = 44

    halign = center
    valign = center
    position = 0, -200
}

# ----------------------------------------
# Date
# ----------------------------------------
text {
    monitor = eDP-1
    text = $DATE
    color = rgb(137, 180, 250)
    font = "Fira Code"
    font_size = 22

    halign = center
    valign = center
    position = 0, -150
}

# ----------------------------------------
# Username
# ----------------------------------------
text {
    monitor = eDP-1
    text = $USER
    color = rgb(205, 214, 244)
    font = "Fira Code"
    font_size = 22

    halign = center
    valign = center
    position = 0, -60
}

# ----------------------------------------
# Password Field (lowered)
# ----------------------------------------
input-field {
    monitor = eDP-1
    size = 320, 58
    rounding = 14
    outline_thickness = 2

    font = "Fira Code"
    font_size = 18
    hide_input = false
    placeholder = ""

    inner_color = rgba(30, 30, 46, 0.90)
    outline_color = rgba(137, 180, 250, 0.30)
    text_color = rgb(205, 214, 244)

    halign = center
    valign = center
    position = 0, 40
}

# ----------------------------------------
# Disable lockout
# ----------------------------------------
fail_counter {
    enabled = false
}

